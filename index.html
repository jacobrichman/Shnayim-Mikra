<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parsha Side by Side</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;500;700&display=swap');

      @font-face {
        font-family: 'ShlomoStam';
        src: url('./fonts/ShlomoStam.ttf') format('truetype');
      }

      :root {
        --bg: #f4efe8;
        --panel: #fffdf9;
        --ink: #1f2430;
        --muted: #5d6470;
        --hebrew: #3a2a15;
        --english: #2c4466;
        --line: #e8dcc4;
        --accent: #a77a4d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(180deg, #f4efe8 0%, #f7f2ea 100%);
        color: var(--ink);
      }

      .page {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px 40px;
      }

      .header {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 20px 12px;
        box-shadow: 0 6px 20px rgba(40, 29, 17, 0.05);
        margin-bottom: 18px;
      }

      .header h1 {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-family: 'ShlomoStam', 'Noto Serif Hebrew', serif;
        color: var(--hebrew);
        direction: rtl;
        text-align: center;
      }

      .header h1 .title-main {
        font-size: clamp(1.8rem, 2vw, 2.4rem);
        letter-spacing: 0.02em;
        line-height: 1.2;
      }

      .header h1 .title-sub {
        font-size: clamp(0.9rem, 1.3vw, 1.25rem);
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1.4;
        opacity: 0.9;
      }

      .header .meta {
        display: none;
      }

      .status {
        display: none;
      }

      .table {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(32, 24, 14, 0.05);
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        border-bottom: 1px solid var(--line);
      }

      .row:last-child {
        border-bottom: none;
      }

      .cell {
        padding: 16px 18px 14px;
        min-height: 88px;
        line-height: 1.7;
        font-size: 1rem;
        display: block;
      }

      .verse-cell {
        display: none;
      }

      .english-inline,
      .cell-content,
      .plain-note {
        display: inline;
        white-space: normal;
      }

      .cell + .cell {
        border-left: 1px solid var(--line);
      }

      .verse-num {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .lang {
        display: none;
      }

      .hebrew {
        direction: rtl;
        font-family: 'ShlomoStam', serif;
        color: var(--hebrew);
        font-size: 1.3rem;
        line-height: 1.9;
        font-feature-settings: "liga" 1, "kern" 1;
        font-weight: 400;
      }

      .english {
        color: var(--english);
        font-family: "Georgia", serif;
        font-size: 0.9rem;
      }

      .english strong {
        font-weight: 700;
        color: var(--ink);
      }

      .plain-note {
        font-weight: 400;
      }

      .empty {
        opacity: 0.35;
      }


      /* A4 print pages: fixed-size page boxes with three Hebrew+English
         column pairs, filled on screen, so printing reproduces exactly what
         is shown. Same method as the BT Siddur. On wide screens the rows move
         into the pages; on small screens the pages are built from hidden
         copies so the mobile layout stays untouched but printing still
         produces the A4 pages. */
      body.paginated .table,
      body.paginated-print .table {
        display: none;
      }

      .a4-box {
        width: 210mm;
        height: 297mm;
        background: var(--panel);
        border: 1px solid #ccc;
        box-shadow: 0 8px 24px rgba(32, 24, 14, 0.08);
        padding: 0; /* Edge to edge: the printer's fit-to-page supplies the margin. */
        box-sizing: border-box;
        margin: 24px auto;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .a4-box .header {
        margin-bottom: 6px;
        padding: 6px 8px 4px;
      }

      .a4-box .a4-col .header {
        margin: 0 0 4px;
        padding: 4px 4px 2px;
      }

      .a4-box .header h1 .title-main {
        font-size: 0.65rem;
      }

      .a4-box .header h1 .title-sub {
        font-size: 0.4rem;
      }

      .a4-cols {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      .a4-col {
        flex: 1;
        min-width: 0;
        height: 100%;
      }

      .a4-col + .a4-col {
        border-left: 1px solid var(--line);
        padding-left: 1mm;
        margin-left: 1mm;
      }

      /* Rows keep the side-by-side Hebrew/English grid inside pages even on
         narrow screens, where the regular layout stacks them. */
      .a4-box .row {
        grid-template-columns: minmax(0, 1fr);
      }

      .a4-box .cell + .cell {
        border-left: none;
        border-top: 1px solid var(--line);
      }

      /* Print-density typography: one third of the screen sizes. */
      .a4-box .cell {
        padding: 0px 2px;
        min-height: auto;
        line-height: 1.18;
        font-size: calc(1rem / 2.5);
      }

      .a4-box .hebrew {
        font-size: calc(1.3rem / 2.5);
        line-height: 1.35;
      }

      .a4-box .english {
        font-size: calc(0.981rem / 2.5); /* English at +9% relative size, enlarged in the tightened four-column pages. */
      }

      .a4-box .verse-num {
        font-size: calc(0.72rem / 2.5);
      }

      /* Grayscale print pages: dark text and rules, no background tint. */
      .a4-box {
        background: #fff;
        border-color: #b5b5b5;
        box-shadow: none;
        color: #111;
      }

      .a4-box .header {
        background: none;
        border-color: #999;
        box-shadow: none;
      }

      .a4-box .header h1 {
        color: #000;
      }

      .a4-box .hebrew {
        color: #000;
      }

      .a4-box .english {
        color: #1a1a1a;
      }

      .a4-box .english strong {
        color: #000;
      }

      .a4-box .verse-num {
        color: #444;
      }

      .a4-box .row {
        border-bottom-color: #b5b5b5;
      }

      .a4-box .cell + .cell {
        border-top-color: #b5b5b5;
      }

      .a4-box .a4-col + .a4-col {
        border-left-color: #999;
      }

      /* Hairline rules: Chrome clamps borders to 1pt in print, so draw
         the rules as 0.5px gradient backgrounds instead. */
      .a4-box .row {
        border-bottom: none;
        background-image: linear-gradient(#b5b5b5, #b5b5b5);
        background-size: 100% 0.5px;
        background-position: bottom left;
        background-repeat: no-repeat;
      }

      .a4-box .row:last-child {
        background-image: none;
      }

      .a4-box .cell + .cell {
        border-top: none;
        background-image: linear-gradient(#b5b5b5, #b5b5b5);
        background-size: 100% 0.5px;
        background-position: top left;
        background-repeat: no-repeat;
      }

      .a4-box .a4-col + .a4-col {
        border-left: none;
        background-image: linear-gradient(#999, #999);
        background-size: 0.5px 100%;
        background-position: top left;
        background-repeat: no-repeat;
      }

      .a4-box--grow {
        height: auto;
        overflow: visible;
      }

      /* Small screens: keep the pages off the screen, show them when printing. */
      @media screen {
        body.paginated-print #pages {
          position: absolute;
          visibility: hidden;
          top: 0;
          left: 0;
        }

        body.paginated-print .table {
          display: block;
        }
      }

      @media (max-width: 700px) {
        .row {
          grid-template-columns: 1fr;
        }

        .verse-cell {
          border-left: none;
          border-right: none;
          border-top: 1px solid var(--line);
          border-bottom: 1px solid var(--line);
          justify-content: flex-start;
          padding-top: 12px;
        }

        .cell + .cell {
          border-left: none;
          border-top: 1px solid var(--line);
        }
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }

        body {
          background: #fff;
          margin: 0;
        }

        .status {
          display: none !important;
        }

        .row {
          break-inside: avoid;
          page-break-inside: avoid;
        }

        /* Original flowing print layout, used when the page boxes were not built
           (small screens or the unpaginated view). */
        body:not(.paginated):not(.paginated-print) .page {
          max-width: none;
          width: 210mm;
          min-height: 297mm;
          margin: 0;
          padding: 0;
        }

        body:not(.paginated):not(.paginated-print) .header {
          display: block !important;
          background: transparent;
          border: none;
          border-radius: 0;
          box-shadow: none;
          padding: 0 0 10mm;
          margin: 0;
        }

        body:not(.paginated):not(.paginated-print) .header h1 {
          font-size: 22pt;
          text-align: center;
        }

        body:not(.paginated):not(.paginated-print) .table {
          border: none;
          box-shadow: none;
          border-radius: 0;
        }

        body:not(.paginated):not(.paginated-print) .row {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        body:not(.paginated):not(.paginated-print) .cell {
          padding: 6px 10px;
          min-height: auto;
        }

        body:not(.paginated):not(.paginated-print) .english {
          font-size: 10.5pt;
        }

        body:not(.paginated):not(.paginated-print) .hebrew {
          font-size: 18pt;
          line-height: 1.6;
        }

        /* Paginated layout: each on-screen A4 box prints as exactly one page. */
        body.paginated .page,
        body.paginated-print .page {
          max-width: none;
          margin: 0;
          padding: 0;
        }

        body.paginated .table,
        body.paginated-print .table {
          display: none !important;
        }

        body.paginated-print #pages {
          position: static !important;
          visibility: visible !important;
        }

        body.paginated-print .page > .header {
          display: none !important;
        }

        body.paginated .a4-box,
        body.paginated-print .a4-box {
          border: none;
          box-shadow: none;
          margin: 0;
          page-break-after: always;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        body.paginated .a4-box:last-child,
        body.paginated-print .a4-box:last-child {
          page-break-after: auto;
        }

        body.paginated .a4-box--grow,
        body.paginated-print .a4-box--grow {
          height: auto;
          overflow: visible;
        }

        body.paginated .page > a,
        body.paginated-print .page > a {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <h1 id="title" aria-live="polite">
          <span id="titleMain" class="title-main"></span>
          <span id="titleSub" class="title-sub"></span>
        </h1>
        <div class="meta">
          <span id="ref"></span>
          <span id="heRef"></span>
        </div>
      </div>

      <div id="status" class="status"></div>
      <div id="table" class="table"></div>
      <a href="./README.md" style="font-size: 0.72rem; color: #5d6470; display: inline-block; margin-top: 8px;">Sources</a>
    </div>

    <script type="module">
      import { verseRows, displayStore } from "./scripts/phrases.mjs";
      function formatDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function parseRefStart(ref) {
        const match = ref.match(/(\d+):(\d+)\s*-\s*(\d+):(\d+)/);
        if (match) {
          return {
            startChapter: parseInt(match[1], 10),
            startVerse: parseInt(match[2], 10),
          };
        }

        const singleMatch = ref.match(/(\d+):(\d+)/);
        if (singleMatch) {
          return {
            startChapter: parseInt(singleMatch[1], 10),
            startVerse: parseInt(singleMatch[2], 10),
          };
        }

        return { startChapter: 1, startVerse: 1 };
      }

      function normalizeDivineName(text) {
        return String(text || '')
          .replace(/G-d/gi, 'Hashem')
          .replace(/\b(?:[Tt]he\s+)?(?:L-(?:o)?rd|LORD|Lord)\b/g, 'Hashem')
          .replace(/י(?:[\u0591-\u05C7\-–—]*)ה(?:[\u0591-\u05C7\-–—]*)ו(?:[\u0591-\u05C7\-–—]*)ה/g, 'ה׳')
          .replace(/יהוה/g, 'ה׳');
      }

      function normalizeWhitespaceText(text) {
        return String(text || '')
          .replace(/&nbsp;/gi, ' ')
          .replace(/&thinsp;/gi, ' ')
          .replace(/\u00A0/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function formatEnglishWithBracketStyle(text) {
        const raw = normalizeDivineName(String(text || ''))
          .replace(/&nbsp;/gi, ' ')
          .replace(/&thinsp;/gi, ' ')
          .replace(/\u00A0/g, ' ')
          .replace(/\s+/g, ' ')
          .replace(/([^\s(])\(/g, '$1 (')
          .replace(/\(\s+/g, '(')
          .replace(/\s+\)/g, ')')
          .replace(/\s+([,.;:!?])/g, '$1')
          .replace(/([,;:])(?=[^\s,.;:!?)}\]\d])/g, '$1 ')
          .replace(/\)(?=[A-Za-z0-9(])/g, ') ')
          .trim();

        const safe = raw
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        const parts = safe.split(/(\[[^\]]*\])/g);

        let rendered = '';

        for (let i = 0; i < parts.length; i++) {
          const part = parts[i];
          if (!part) continue;

          if (/^\[[^\]]*\]$/.test(part)) {
            const noteText = part.slice(1, -1).replace(/\s+/g, ' ').trim();
            if (!noteText) continue;

            const prevText = rendered.replace(/<[^>]*>/g, '').trimEnd();
            const spacer = rendered && !/[([{]$/.test(prevText) && !/^[,.;:!?)}\]]/.test(noteText) ? ' ' : '';

            rendered += spacer + '<span class="plain-note">' + noteText + '</span>';
            continue;
          }

          if (!part.trim()) continue;

          const plainText = part.trim();
          const prevText = rendered.replace(/<[^>]*>/g, '').trimEnd();
          const needsSpace = rendered && !/[([{]$/.test(prevText) && !/^[,.;:!?)}\]]/.test(plainText);

          rendered += (needsSpace ? ' ' : '') + '<span class="cell-content"><strong>' + plainText + '</strong></span>';
        }

        return '<span class="english-inline">' + rendered + '</span>';
      }

      function parseAliyahRange(ref, index) {
        const rangeText = String(ref || '').trim();
        if (!rangeText) {
          return null;
        }

        const parts = rangeText.split('-');
        const firstPart = parts[0] || rangeText;
        const secondPart = parts[1] || firstPart;

        const startMatch = firstPart.match(/(\d+):(\d+)$/);
        const endMatch = secondPart.match(/(\d+):(\d+)$/);

        if (!startMatch || !endMatch) {
          return null;
        }

        return {
          number: index + 1,
          ref: rangeText,
          startChapter: parseInt(startMatch[1], 10),
          startVerse: parseInt(startMatch[2], 10),
          endChapter: parseInt(endMatch[1], 10),
          endVerse: parseInt(endMatch[2], 10),
        };
      }

      function getAliyahNumberForVerse(verseRef, aliyot) {
        const [chapterText, verseText] = String(verseRef || '').split(':');
        const chapter = parseInt(chapterText, 10);
        const verse = parseInt(verseText, 10);
        const verseKey = chapter * 100000 + verse;

        for (let i = 0; i < aliyot.length; i += 1) {
          const range = aliyot[i];
          const startKey = range.startChapter * 100000 + range.startVerse;
          const endKey = range.endChapter * 100000 + range.endVerse;
          if (verseKey >= startKey && verseKey <= endKey) {
            return range.number;
          }
        }

        return null;
      }

      async function fetchJson(url) {
        const response = await fetch(url, {
          headers: { Accept: 'application/json' },
        });

        if (!response.ok) {
          throw new Error('Request failed (' + response.status + ') for ' + url);
        }

        return response.json();
      }

      async function loadParsha() {
        const date = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
        const override = new URLSearchParams(location.search).get('parsha');
        let item;
        let overrideMissed = false;
        if (override) {
          if (override.length > 100 || /[<>\/]/.test(override)) throw new Error('Invalid parsha name');
          const reading = await fetchJson('https://www.sefaria.org/api/calendars/next-read/' + encodeURIComponent(override.trim()) + '?diaspora=0');
          item = reading.parasha;
          if (!item && override.includes(' ')) item = (await fetchJson('https://www.sefaria.org/api/calendars/next-read/' + encodeURIComponent(override.trim().replace(/\s+/g,'-')) + '?diaspora=0')).parasha;
          overrideMissed = !item;
        }
        if (!item) {
          const [year,month,day] = date.split('-');
          const calendar = await fetchJson('https://www.sefaria.org/api/calendars?' + new URLSearchParams({year,month,day,diaspora:'0',timezone:'Asia/Jerusalem'}));
          item = calendar.calendar_items.find(function (entry) {
            return entry && entry.title && entry.title.en === 'Parashat Hashavua';
          });
        }

        if (!item) {
          throw new Error('No parsha was found for today.');
        }

        const ref = item.ref;
        const parashaName = item.displayValue && item.displayValue.en ? item.displayValue.en : ref.split(' ')[0];
        const [aliyotResult, hebrewData, englishData] = await Promise.all([
          fetchJson('https://www.sefaria.org/api/sheets/' + encodeURIComponent(parashaName) + '/get_aliyot'),
          fetchJson('https://www.sefaria.org/api/v3/texts/' + encodeURIComponent(ref) + '?version=' + encodeURIComponent('hebrew|Miqra according to the Masorah') + '&return_format=text_only'),
          fetchJson('https://www.sefaria.org/api/v3/texts/' + encodeURIComponent(ref) + '?version=' + encodeURIComponent('english|The Rashi chumash by Rabbi Shraga Silverstein') + '&return_format=text_only')
        ]);

        const aliyot = (aliyotResult && Array.isArray(aliyotResult.ref) ? aliyotResult.ref : []).map(parseAliyahRange).filter(Boolean);
        const heText = (hebrewData.versions && hebrewData.versions[0] && hebrewData.versions[0].text) || '';
        const enText = (englishData.versions && englishData.versions[0] && englishData.versions[0].text) || '';

        let phrases = null;
        let phraseStatus = 'Phrase data is not available for this parsha. Showing the original verses.';
        try {
          const cache = await fetchJson('./data/phrases.json');
          phrases = displayStore(cache, verseRows(heText, enText, ref), ref);
          phraseStatus = 'Phrase view: AI-generated alignment of the original Sefaria text. Review phrase meanings against the original.';
        } catch (error) { console.info('Phrase view unavailable:', error.message); }
        renderParsha({
          phrases,
          phraseStatus,
          title: item.displayValue && item.displayValue.en ? item.displayValue.en : item.ref,
          hebrewTitle: item.displayValue && item.displayValue.he ? item.displayValue.he : item.heRef,
          ref: ref,
          heRef: item.heRef || '',
          hebrewText: heText,
          englishText: enText,
          aliyot: aliyot,
          notice: overrideMissed ? 'We could not find a parsha named "' + override.trim() + '", so this week\'s parsha is shown.' : null,
        });
      }


      // A4 print pagination, adapted from the BT Siddur method: every row
      // starts in the first column of the first fixed-size A4 page, then rows
      // that do not fit move to the next column, and after the last column
      // onto the next page, until every row has a place. Wide screens show the
      // pages on screen; small screens keep the mobile table on screen and use
      // hidden copies of the rows so printing still yields the A4 pages.
      function a4PageHeightUsed(parent) {
        let height = 0;
        for (const child of parent.children) {
          const style = window.getComputedStyle(child);
          height += child.offsetHeight;
          height += parseFloat(style.marginTop) || 0;
          height += parseFloat(style.marginBottom) || 0;
        }
        return height;
      }

      function paginateA4() {
        if (document.body.classList.contains('paginated') || document.body.classList.contains('paginated-print')) return;
        const forcePages = document.body.classList.contains('force-pages');
        const wideEnough = forcePages || window.matchMedia('(min-width: 701px)').matches || window.matchMedia('print').matches;

        const pageEl = document.querySelector('.page');
        const header = pageEl.querySelector('.header');
        const table = document.getElementById('table');
        if (!table || !table.children.length) return;

        const moveRows = wideEnough; // small screens keep their table and get cloned print pages
        document.body.classList.add(moveRows ? 'paginated' : 'paginated-print');

        const pages = document.createElement('div');
        pages.id = 'pages';
        pageEl.insertBefore(pages, table);

        function makeBox() {
          const box = document.createElement('div');
          box.className = 'a4-box';
          const cols = document.createElement('div');
          cols.className = 'a4-cols';
          for (let i = 0; i < 7; i++) {
            const col = document.createElement('div');
            col.className = 'a4-col';
            cols.appendChild(col);
          }
          box.appendChild(cols);
          return box;
        }

        const firstBox = makeBox();
        pages.appendChild(firstBox);
        if (header) firstBox.querySelectorAll('.a4-col')[3].prepend(moveRows ? header : header.cloneNode(true));

        const firstCol = firstBox.querySelector('.a4-col');
        if (moveRows) {
          while (table.firstChild) {
            firstCol.appendChild(table.firstChild);
          }
          table.remove();
        } else {
          for (const row of table.children) {
            firstCol.appendChild(row.cloneNode(true));
          }
        }

        let active = firstBox;
        while (active) {
          const cols = active.querySelectorAll('.a4-col');
          const usable = cols[0].clientHeight;
          for (let i = 0; i < cols.length; i++) {
            const col = cols[i];
            while (a4PageHeightUsed(col) > usable && col.children.length > 1) {
              const last = col.lastElementChild;
              if (i < cols.length - 1) {
                const target = cols[i + 1];
                const firstEl = target.firstElementChild;
                target.insertBefore(last, firstEl && firstEl.classList.contains('header') ? firstEl.nextElementSibling : firstEl);
              } else {
                let next = active.nextElementSibling;
                if (!next) {
                  next = makeBox();
                  active.after(next);
                }
                next.querySelector('.a4-col').insertBefore(last, next.querySelector('.a4-col').firstChild);
              }
            }
            if (a4PageHeightUsed(col) > usable) {
              // A single row taller than a whole column: let the page grow instead of clipping text.
              active.classList.add('a4-box--grow');
              console.warn('A row is taller than one A4 column; its page was allowed to grow.');
            }
          }
          active = active.nextElementSibling;
        }
      }

      // Remembers where each parsha was scrolled to in browser storage, so
      // reopening a parsha returns to the same place. Storage is keyed by the
      // parsha ref, so every parsha keeps its own position.
      const scrollStoreKey = 'shnayim-mikra.scrollPositions';

      function readScrollPositions() {
        try {
          const parsed = JSON.parse(localStorage.getItem(scrollStoreKey));
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch (error) {
          return {};
        }
      }

      function rememberScrollPosition(parshaKey) {
        let saveQueued = false;
        function save() {
          saveQueued = false;
          try {
            const positions = readScrollPositions();
            positions[parshaKey] = Math.round(window.scrollY);
            const keys = Object.keys(positions);
            if (keys.length > 20) {
              // Keep at most the 20 most recent parshiyot so storage stays small.
              for (const oldKey of keys.slice(0, keys.length - 20)) delete positions[oldKey];
            }
            localStorage.setItem(scrollStoreKey, JSON.stringify(positions));
          } catch (error) {
            // Storage unavailable (for example private browsing): nothing to save.
          }
        }
        window.addEventListener('scroll', () => {
          if (!saveQueued) {
            saveQueued = true;
            requestAnimationFrame(save);
          }
        }, { passive: true });
        window.addEventListener('pagehide', save);
      }

      function restoreScrollPosition(parshaKey) {
        const saved = readScrollPositions()[parshaKey];
        if (typeof saved !== 'number' || saved <= 0) return;
        let userScrolled = false;
        window.addEventListener('scroll', () => { userScrolled = true; }, { passive: true });
        document.fonts.ready.then(() => {
          // Registered after paginateA4's own frame, so the A4 page layout has
          // settled before the scroll is restored. Skipped when the reader
          // already scrolled while the page was loading.
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (!userScrolled) window.scrollTo(0, saved);
            });
          });
        });
      }

      function renderParsha(data) {
        const titleMain = data.hebrewTitle || data.title || '';
        const titleSub = data.heRef || '';

        document.getElementById('titleMain').textContent = titleMain;
        document.getElementById('titleSub').textContent = titleSub;
        document.getElementById('ref').textContent = '';
        document.getElementById('heRef').textContent = '';

        const sourceRows = verseRows(data.hebrewText, data.englishText, data.ref);
        const displayRows = data.phrases ? data.phrases.flatMap((entry, index) => entry.pairs.map((pair, pairIndex) => ({...pair, verse: entry.verse, phrase: pair.wholeVerse ? null : pairIndex + 1}))) : sourceRows;
        let previousAliyah = null;

        for (let i = 0; i < displayRows.length; i++) {
          const rowAliyah = getAliyahNumberForVerse(displayRows[i].verse, data.aliyot || []);
          displayRows[i].aliyah = rowAliyah;
          displayRows[i].isAliyahStart = rowAliyah && rowAliyah !== previousAliyah;
          previousAliyah = rowAliyah;
        }

        const table = document.getElementById('table');
        table.innerHTML = '';

        for (let i = 0; i < displayRows.length; i++) {
          const row = document.createElement('div');
          row.className = 'row';

          const heCell = document.createElement('div');
          heCell.className = 'cell hebrew' + (displayRows[i].hebrew ? '' : ' empty');
          if (displayRows[i].isAliyahStart) {
            const badge = document.createElement('span');
            badge.className = 'verse-num';
            badge.textContent = ' ' + displayRows[i].aliyah + ' ';
            heCell.appendChild(badge);
          }

          const safeHebrewText = normalizeDivineName(normalizeWhitespaceText(displayRows[i].hebrew));
          if (safeHebrewText) {
            heCell.appendChild(document.createTextNode(safeHebrewText));
          } else {
            heCell.appendChild(document.createTextNode('—'));
          }

          const enCell = document.createElement('div');
          enCell.className = 'cell english' + (displayRows[i].english ? '' : ' empty');
          const formattedEnglish = formatEnglishWithBracketStyle(displayRows[i].english || '—');
          enCell.innerHTML = '<span class="verse-num">' + displayRows[i].verse + (displayRows[i].phrase ? ' · ' + displayRows[i].phrase : '') + '</span> ' + formattedEnglish;

          row.appendChild(heCell);
          if (displayRows[i].error) {
            const note = document.createElement('small');
            note.style.color = '#b00020';
            note.textContent = displayRows[i].wholeVerse ? 'Phrase alignment unavailable here. Original verse: ' : 'Phrase alignment error. Original text: ';
            note.setAttribute('role', 'note');
            enCell.prepend(note);
          }
          row.appendChild(enCell);
          table.appendChild(row);
        }

        document.getElementById('status').textContent = '';
        if (data.notice || !data.phrases) {
          const popup = document.createElement('dialog');
          popup.style.cssText = 'max-width: min(28rem, 80vw); border: 1px solid #ddcdb3; border-radius: 12px; padding: 24px; background: #fffdf9; color: #342819; font: 16px/1.5 Georgia, serif';
          const message = document.createElement('p');
          message.textContent = [data.notice, !data.phrases ? 'Phrase data is not available for this parsha. Showing the original verses.' : null].filter(Boolean).join(' ');
          popup.setAttribute('aria-label', 'Phrase data unavailable');
          const close = document.createElement('button');
          close.textContent = 'OK';
          close.style.cssText = 'padding: 6px 20px; cursor: pointer';
          close.addEventListener('click', () => { popup.close(); popup.remove(); });
          popup.append(message, close);
          document.body.append(popup);
          popup.showModal();
        }

        document.fonts.ready.then(() => requestAnimationFrame(paginateA4));
        window.addEventListener('beforeprint', paginateA4);
        rememberScrollPosition(data.ref);
        restoreScrollPosition(data.ref);
      }

      loadParsha().catch(function (error) {
        document.getElementById('status').textContent = '';
        const table = document.getElementById('table');
        table.innerHTML = '';
        const message = document.createElement('p');
        message.style.cssText = 'padding: 40px 24px; text-align: center; color: #5d6470; font: 16px/1.6 Georgia, serif';
        message.textContent = 'Unable to load this parsha. Check the parsha name in the URL and try again.';
        table.appendChild(message);
        console.error(error);
      });
    </script>
  </body>
</html>
