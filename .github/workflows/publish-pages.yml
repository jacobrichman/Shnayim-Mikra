name: Publish static study page
on:
  push:
    branches: [main, feature/gemini-phrase-alignment]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage only public site files
        run: |
          mkdir -p _site/scripts
          cp index.html README.md _site/
          cp -r fonts _site/
          cp scripts/phrases.mjs _site/scripts/
          if [ -f data/phrases.json ]; then
            mkdir -p _site/data
            cp data/phrases.json _site/data/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
